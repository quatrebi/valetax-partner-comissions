syntax = "proto3";

package valetax.partners.v1;
option csharp_namespace = "Valetax.Partners.Api.Grpc";

service PartnersService {
  rpc GetPartnerAncestors (GetPartnerAncestorsRequest) returns (GetPartnerAncestorsResponse);
}

message GetPartnerAncestorsRequest {
  string partner_external_id = 1;
}

message PartnerAncestorNode {
  string external_id = 1;
  int32 level = 2;
}

message GetPartnerAncestorsResponse {
  repeated PartnerAncestorNode nodes = 1;
}
